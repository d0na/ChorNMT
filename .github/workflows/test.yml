name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ETH_USD_PRICE: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bpmn-builder-js/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bpmn-builder-js
      - run: npm run compile
      - run: npm test
      - name: Import reference BPMN models
        run: |
          node bpmn-builder-js/scripts/import-bpmn.js references/paper-example.bpmn "$RUNNER_TEMP/paper-example.nmt.json"
          node bpmn-builder-js/scripts/import-bpmn.js references/parallel-gateway-example.bpmn "$RUNNER_TEMP/parallel-gateway-example.nmt.json"
