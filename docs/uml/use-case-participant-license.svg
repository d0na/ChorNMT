g" textLength="96.7266" x="321.2622" y="598.8618">after the purchase</text></g><g id="elem_UC_Link"><ellipse cx="372.6063" cy="91.0013" fill="#F4F8FB" rx="79.8063" ry="18.3613" style="stroke:#3A6EA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="129.4102" x="307.9012" y="92.2415">Link a role to the license</text></g><g id="elem_UC_Type"><ellipse cx="706.8443" cy="96.9989" fill="#F4F8FB" rx="107.3443" ry="23.8689" style="stroke:#3A6EA5;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="646.478" y="92.2391">Check the license type</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.7363" x="627.4761" y="104.2391">(ChoreographyParticipantAM)</text></g><!--entity Authority--><g id="elem_Authority"><ellipse cx="79.3652" cy="256" fill="#F1F1F1" rx="16" ry="16" style="stroke:#181818;stroke-width:0.5;"/><path d="M79.3652,276 C83.3652,276 86.3652,276 90.3652,272 C98.3652,272 106.3652,280 106.3652,288 L106.3652,292 C106.3652,296 102.3652,300 98.3652,300 L60.3652,300 C56.3652,300 52.3652,296 52.3652,292 L52.3652,288 C52.3652,280 60.3652,272 68.3652,272 C72.3652,276 75.3652,276 79.3652,276 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="47.3555" x="6" y="309.7402">Authority</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="126.7441" x="6" y="321.7402">(accounts 9-13, one per</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="146.7305" x="6" y="333.7402">license type; transport: two)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="98.0391" x="6" y="345.7402">issuer and certifier</text></g><!--entity LicenseHolder--><g id="elem_Lic